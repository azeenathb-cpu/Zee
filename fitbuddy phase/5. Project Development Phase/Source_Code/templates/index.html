<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - AI Fitness Plan Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>FitBuddy</h1>

        <h2>AI Fitness Plan Generator</h2>

        <p class="subtitle">
            Create your personalized 7-day workout plan
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form action="/generate-workout"
              method="post">


            <label>Name</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your name"
                required
            >


            <label>User ID</label>

            <input
                type="number"
                name="user_id"
                placeholder="Enter user ID"
                required
            >


            <label>Age</label>

            <input
                type="number"
                name="age"
                min="1"
                max="100"
                placeholder="Enter age"
                required
            >


            <label>Weight (kg)</label>

            <input
                type="number"
                name="weight"
                step="0.1"
                min="1"
                placeholder="Enter weight"
                required
            >


            <label>Fitness Goal</label>

            <select name="goal" required>

                <option value="">
                    Select your goal
                </option>

                <option value="General Fitness">
                    General Fitness
                </option>

                <option value="Weight Loss">
                    Weight Loss
                </option>

                <option value="Muscle Gain">
                    Muscle Gain
                </option>

                <option value="Flexibility">
                    Flexibility
                </option>

                <option value="Endurance">
                    Endurance
                </option>

            </select>


            <label>Workout Intensity</label>

            <select name="intensity" required>

                <option value="">
                    Select intensity
                </option>

                <option value="Low">
                    Low
                </option>

                <option value="Moderate">
                    Moderate
                </option>

                <option value="High">
                    High
                </option>

            </select>


            <button type="submit">
                Generate Plan
            </button>

        </form>


        <a
            class="admin-link"
            href="/view-all-users"
        >
            View All Users
        </a>

    </div>

</div>

</body>

</html>
